        .subscribe-form input {

        .subscribe-form button {

        }
        .report-card:hover {

            border-color: var(--primary); background-color: var(--hover-bg);
        }
        .report-card .icon { font-size: 1.5rem; margin-right: 15px; }

        .report-card .date {
