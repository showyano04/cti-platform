[project]
name = "cti-platform"
version = "0.1.0"
description = "CVE/KEV 기반 CTI 콘텐츠 자동 생성 및 배포 플랫폼"
requires-python = ">=3.12"
dependencies = [
    "requests",
    "pydantic",
    "python-dotenv",
    "anthropic",
    "google-generativeai",
    "google-genai",
    "markdown",
    "tenacity",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]